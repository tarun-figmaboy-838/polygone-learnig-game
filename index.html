<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Swiftee — Polygons</title>
<!-- inline, so the page never fires a 404 for a favicon it does not have -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%90%A6</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<!-- the backdrop is the first thing on screen; fetch it alongside the scripts -->
<link rel="preload" as="image" href="assets/ui/banner.webp">
<link rel="preload" as="image" href="assets/bg/ice-vista.png">
<style>
  :root {
    --ink: #1c2a4a;
    --sky: #bfe3fb;
    --bubble: #ffffff;
    --bubble-edge: #9fd6fb;
    --card: #fffdf4;
    /* the instruction card's own rim: teal, so it is never mistaken for the
       speech bubble's orange one */
    --card-rim: #35a9ba;
    --card-rim-dark: #16808f;
    --text-ink: #064d68;
    --sans: "Nunito", "Segoe UI", system-ui, sans-serif;
    /* Comic ink: one outline weight and one hard offset shadow, reused by the
       bubble, the card and every button, so they read as one drawn set
       instead of three unrelated widgets. */
    --ink-w: 3px;
    --ink-shadow: 4px 5px 0 rgba(28, 42, 74, .85);
    --tail-h: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #a9d6f4; font-family: var(--sans); color: var(--ink); overflow: hidden; }

  #game { position: fixed; inset: 0; background: linear-gradient(#bfe3fb, #f7fcff); }
  #stage { position: absolute; inset: 0; }

  /* Swiftee is an HTML/SVG overlay positioned by game.js */
  .swiftee { z-index: 3; }
  /* Hovering in a corner. There is no flying sprite in the rig — the sheet
     set has twenty-six states and none of them is a wing cycle — so what
     makes him read as airborne is that he is off the ground and never quite
     still. `translate`, not `transform`: the element is POSITIONED with a
     transform, and animating that property would replace the position. */
  .swiftee.hover-float { animation: swifteeFloat 3.4s ease-in-out infinite; }
  @keyframes swifteeFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -11px; } }
  @media (prefers-reduced-motion: reduce) { .swiftee.hover-float { animation: none; } }

  /* ---- speech bubble --------------------------------------------------
     The shape and the motion are the supplied design; the colours are the
     game's own. Four parts make it, and each is doing a job:

       the sheen   a catch-light in the top-left corner, so the panel reads as
                   something with a surface rather than as a fill
       the marks   two short strokes either side converging on the box — the
                   comic-book "said with feeling"
       the horn    a curved tail off whichever edge faces Swiftee, FILLED
                   first so it covers the body's own border at the join and
                   then stroked along its two free edges only, so one unbroken
                   outline runs round body and horn together
       the pop     it grows out of the horn. aimTail() sets the origin to
                   wherever the horn ended up, so the bubble springs from
                   Swiftee rather than from an arbitrary corner

     EVERYTHING IS SIZED IN em, off one clamped font-size on #bubble itself.
     Padding, radius, horn, sheen and marks then scale together, and the phone
     breakpoints only have to change one number.

     THREE DEPARTURES from the supplied file, each for a reason:

       NO GHOST COPY. It reserved the final width with a hidden duplicate of
       the line while the live copy sat absolutely on top of it. That is what
       you need when text is typed a character at a time and grows. Here every
       word is laid out from the first frame and hidden with opacity, so the
       box is already its final size and the duplicate has nothing to reserve
       — it only doubled the DOM and left wrapped text left-aligned inside a
       centred box.

       NO 10px TEXT OFFSET. `.type-wrap { margin-left: 10px }` pushed the line
       ten pixels right of centre against em-based padding: measured at 1280,
       800 and 390, a constant 10px, which on a phone is nearly half an em.

       THE MARKS SIT INSIDE THE PADDING, not outside the box. The bubble's
       position is measured against the lesson so it never covers the polygon,
       and anything painted outside its border box is invisible to that
       measurement — the marks would be the one part of the bubble free to
       land on the shape.
  */
  #bubble {
    --cream: #fff8e7;
    --cream-light: #fffdf5;
    --cream-foot: #fff2d6;
    --orange: #ffb515;
    --orange-dark: #e08200;
    --text: #064d68;
    --rim: 4px;

    position: absolute; z-index: 4;
    box-sizing: border-box;
    /* One size for the whole component; the padding below is em of this, and
       so is everything the skin is drawn from. */
    font-size: clamp(20px, 2.3vw, 33px);
    max-width: min(820px, 68vw);
    min-width: 5em;
    padding: .62em 1em;
    display: flex; align-items: center; justify-content: center;

    /* NO BORDER, NO BACKGROUND, NO RADIUS.
       All three now belong to .bubble-skin, an SVG drawn behind the words —
       see paintSkin() in game.js. A CSS box cannot grow a tail, so the tail
       used to be a second SVG laid over the box's bottom edge, and the seam
       between the two was a losing battle: cover the rim and the outline has
       a gap in it, leave it and the tail reads as pinned on. Body and horn
       are one path now, so there is no junction to get wrong. */
    opacity: 0; pointer-events: none;
    transform: scale(.15);
    transform-origin: 12% 100%;
    transition: transform 440ms cubic-bezier(.2, .9, .3, 1.45), opacity 200ms ease;
  }
  #bubble.show { opacity: 1; pointer-events: auto; cursor: pointer; transform: none; }
  /* going away is quicker than arriving, and does not overshoot */
  #bubble.out { transition: transform 260ms ease-in, opacity 220ms ease 40ms; }

  .dialogue-inner {
    position: relative; z-index: 2; max-width: 100%;
    color: var(--text);
    font-family: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", var(--sans);
    font-size: inherit; font-weight: 600; line-height: 1.2;
    letter-spacing: .2px; text-align: center;
    /* NOT text-wrap: balance. Balance evens the rows of a wrapped sentence so
       neither row reaches the edge of the box — which, in a box sized to the
       space beside the lesson, means a band of empty paper down both sides
       and a short-looking line adrift in a wide frame. Ordinary wrapping
       fills the first row to the edge, so the box the text shrink-wraps into
       is the box the text actually needs. */
  }
  /* Screens with nothing else on them get room to breathe. It is one number,
     because everything else is em. */
  #bubble.solo { font-size: clamp(26px, 3.15vw, 46px); }
  /* ONE step down, and only one.

     The type used to be shrunk sentence by sentence — three per cent at a
     time, down to half — until each line fit on a single row. It worked, and
     a child reading the game saw the words change size every time Swiftee
     spoke, because the size was being decided by how long that particular
     sentence happened to be. Text that changes size looks squeezed in, and it
     is the loudest way for a game to read as unfinished.

     So there are two sizes per tier and nothing in between: the normal one,
     and this, used only when a sentence would otherwise run past two rows in
     the space it has been given. Two discrete sizes are a decision; a
     continuous scale is an accident. */
  #bubble.tight .dialogue-inner { font-size: clamp(17px, 1.95vw, 27px); }
  #bubble.tight.solo .dialogue-inner { font-size: clamp(22px, 2.6vw, 38px); }

  /* Mood tints the paper and nothing else. The rim is the bubble's identity
     and never changes, so a win does not arrive looking like a different
     widget. */
  #bubble[data-mood="win"]   { --cream: #f3fce9; --cream-light: #fdfff8; --cream-foot: #e9f8d9; }
  #bubble[data-mood="hint"]  { --cream: #fff1cf; --cream-light: #fffbee; --cream-foot: #ffeabb; }
  #bubble[data-mood="think"] { --cream: #f1f9fb; --cream-light: #fbfeff; --cream-foot: #e4f3f8; }

  /* ---- the skin ----
     One SVG, one path: the rounded body and the horn drawn as a single
     outline, filled once and stroked once. It is rebuilt whenever the box is
     measured, which is whenever the line changes or the window does.

     It sits outside the bubble's own box by SKIN_PAD on every side, because
     the horn and the stroke are drawn beyond the border box and would
     otherwise be clipped — and because the glow is a drop-shadow on the SVG
     rather than a box-shadow on the div, which would draw a rectangle. */
  .skin-fill  { fill: var(--cream); }
  .skin-line  { fill: none; stroke: var(--orange); stroke-width: var(--rim); stroke-linejoin: round; }
  .skin-sheen { fill: #fff; opacity: .9; }
  .bubble-skin {
    position: absolute; z-index: 0; pointer-events: none; overflow: visible;
    filter: drop-shadow(0 6px 14px rgba(20, 70, 92, .22))
            drop-shadow(0 0 16px rgba(255, 181, 21, .3));
  }

  @media (max-width: 900px) {
    #bubble { font-size: clamp(18px, 2.6vw, 27px); }
    #bubble.solo { font-size: clamp(22px, 3.4vw, 34px); }
  }
  @media (max-width: 600px) {
    #bubble { font-size: clamp(16px, 4.6vw, 23px); --rim: 3px; }
    #bubble.solo { font-size: clamp(18px, 5.4vw, 26px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #bubble { transform: none; transition: opacity 200ms ease; }
    #bubble.out { transition: opacity 160ms ease; }
  }

  /* ---- the line arrives a word at a time ----
     Each word is its own span, faded in on a timer. They are hidden with
     opacity rather than display, so the bubble is laid out at its FINAL size
     from the first frame: it never grows as the words arrive, which means it
     never jitters and never has to be re-placed against the lesson mid-line. */
  .bubble-line .w, .bubble-line .dc-term {
    transition: opacity 260ms cubic-bezier(.2, .7, .3, 1), filter 260ms cubic-bezier(.2, .7, .3, 1);
  }
  .bubble-line.revealing .w, .bubble-line.revealing .dc-term { opacity: 0; filter: blur(4px); }
  .bubble-line .w.in, .bubble-line .dc-term.in { opacity: 1; filter: none; }
  @media (prefers-reduced-motion: reduce) {
    .bubble-line .w, .bubble-line .dc-term { transition: none; }
  }

  /* ---- dual coding: the term is tinted, and the thing it names lights
     up on the stage in that same colour, as the word appears ---- */
  .dc-term {
    display: inline-block;
    padding: .04em .34em; margin: 0 .03em;
    border-radius: .4em; font-weight: 800; white-space: nowrap;
  }
  /* A tinted term and the punctuation that follows it, held together — see
     the note in dual-coding.js. The negative margin closes the gap the chip's
     right padding would otherwise open in front of the mark. */
  .dc-keep { white-space: nowrap; }
  .dc-keep > .w, .dc-keep > .dc-punct { margin-left: -.26em; }

  /* ---- the interaction language ------------------------------------------
     One rule for the whole game: anything the child can touch right now is
     lifted off the scene by a warm halo, in the same amber as the Next
     button, the play button and the speech bubble's rim. Stage.alive() puts
     the class on and takes it off, keyed off the one signal every touchable
     thing already sets — its own cursor — so a new interaction inherits this
     without anybody remembering to.

     A halo rather than a recolouring, because the lesson is already using
     colour to mean things: a picked vertex is yellow, a diagonal that falls
     outside is red. An affordance must not overwrite a fact. */
  /* NOTHING GLOWS BY ITSELF.

     The halo and the breathing were on for as long as a target existed, so a
     screen with four cards had four things pulsing at the child the whole
     time they were trying to read the question. An affordance that never
     stops is not an affordance, it is noise.

     What is left answers the pointer instead: a target lifts and warms under
     the cursor and presses down when it is pushed. The hand cursor is still
     what says 'touchable' before anyone reaches for it. */
  #stage .touchable { transition: filter .14s ease, translate .14s ease; }
  #stage .touchable:hover {
    filter: drop-shadow(0 0 7px rgba(255, 181, 21, .9));
    translate: 0 -3px;
  }
  #stage .touchable:active {
    filter: drop-shadow(0 0 3px rgba(255, 181, 21, .7));
    translate: 0 3px;
  }
  /* The polygon's own vertices carry it themselves — they are redrawn amber
     and larger while they are the target — so a halo on top would only blur
     them. A drop zone is not a button either: it is a place to put something,
     already two hundred pixels of coloured dashed outline, and a glow around
     something that big reads as a rendering fault rather than as an
     invitation. The halo is for things the size of a control. */
  /* A drop zone is two hundred pixels of dashed outline; a ring around
     something that big reads as a rendering fault. It still answers a press. */
  #stage .zone.touchable:hover { filter: none; translate: 0; }
  @media (prefers-reduced-motion: reduce) {
    #stage .touchable { transition: none; }
    #stage .touchable:hover { translate: 0; }
  }

  /* ---- TEMPORARY screen picker -------------------------------------------
     Top-left, and quiet until it is wanted: at a quarter opacity it reads as
     a tool rather than as part of the lesson, and it comes up to full on
     hover or focus. Above the card, because the card is the other thing that
     lives in this corner and the picker has to stay reachable. */
  #jump {
    /* NOT the top-left corner: that is the instruction card's corner (left:3%,
       top:4%, up to 46% wide), and a picker sitting on top of it covered the
       first line of the only text telling the child what to do. This sits in
       the clear strip between the card and the HUD at every width, because
       the card can never pass 49% and the HUD starts at the right edge. */
    position: fixed; top: 6px; left: 52%; z-index: 60;
    max-width: calc(48vw - 96px);
    opacity: .3; transition: opacity .18s ease;
  }
  #jump:hover, #jump:focus-within { opacity: 1; }
  #jump select {
    width: 100%; max-width: 240px; height: 34px;
    font: 600 13px/1 system-ui, sans-serif; color: #17324d;
    background: rgba(255, 255, 255, .94);
    border: 2px solid #9fd6fb; border-radius: 9px;
    padding: 0 6px; cursor: pointer;
  }
  /* Under a phone width there is no clear strip, so it drops below the HUD
     buttons and keeps its own row rather than fighting for one. */
  @media (max-width: 680px) {
    #jump { left: auto; right: 6px; top: 98px; max-width: 46vw; }
  }

  /* ---- instruction card --------------------------------------------------
     The task, not the speech. It shares the bubble's paper so the two belong
     to one game, and differs in every other way so they are never mistaken
     for each other: a teal rim instead of orange, square-shouldered instead
     of bulbous, no horn, no catch-light. The bubble is Swiftee talking; this
     is the game telling you what to do.

     NOT TILTED. It used to sit at -1.2 degrees, as a taped-on note. At this
     size, against a stage of straight edges, that reads as a rendering fault
     rather than as a flourish — and it drags the eye off the words, which is
     the one thing a card of instructions cannot afford.

     BIG ENOUGH TO READ. The old size bottomed out at 15px, which is small for
     a seven-year-old and smaller still against a 40px speech bubble a few
     centimetres away: the thing telling them what to DO was the least
     legible thing on the screen.

     Its width is still capped in game.js against the live stage panel rather
     than guessed here, so it can never grow into the shape being worked on. */
  #card {
    position: absolute; z-index: 4; left: 3%; top: 4%; max-width: 46%;
    box-sizing: border-box;
    background: linear-gradient(180deg, #fffdf5 0%, #fff8e7 100%);
    border: 4px solid var(--card-rim);
    border-radius: 16px;
    padding: .5em .85em;
    font-family: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", var(--sans);
    font-size: clamp(20px, 2.35vw, 32px); font-weight: 600;
    line-height: 1.25; letter-spacing: .2px; color: var(--text-ink);
    box-shadow: 0 5px 0 var(--card-rim-dark), 0 12px 20px rgba(20, 70, 92, .2);
    opacity: 0; transform: translateY(-10px) scale(.96);
    transition: opacity 180ms ease, transform 300ms cubic-bezier(.34, 1.56, .64, 1);
  }
  #card.show { opacity: 1; transform: none; }

  /* A hint of where we are, behind the words.
     ...
     A ridge of hills and two small firs, in one flat ice-blue at a twentieth
     opacity, sitting along the BOTTOM of the card. Three rules keep it from
     becoming clutter:

       it is a silhouette, not a picture — one colour, no detail, nothing to
       read;
       it is along the bottom edge only, so the line of text crosses clean
       card and never a shape;
       it is behind everything, and the text sits on its own layer above it.

     If it ever competes with the instruction it has failed at its only job,
     which is to stop the card looking like a dialog box borrowed from a
     website. */
  #card::before {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
    border-radius: 0 0 12px 12px;
    pointer-events: none; z-index: 0; opacity: .5;
    background: no-repeat bottom / 100% auto
      url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 60' preserveAspectRatio='none'>\
<g fill='%23064d68' opacity='.1'>\
<path d='M0 60 L34 26 L58 44 L86 14 L120 47 L150 30 L182 52 L212 22 L244 46 L272 31 L300 55 L300 60 Z'/>\
</g>\
<g fill='%23064d68' opacity='.13'>\
<path d='M36 60 L36 54 L30 54 L42 38 L36 38 L48 22 L60 38 L54 38 L66 54 L60 54 L60 60 Z'/>\
<path d='M246 60 L246 56 L242 56 L251 44 L246 44 L255 32 L264 44 L259 44 L268 56 L264 56 L264 60 Z'/>\
</g>\
</svg>");
  }
  #card .card-text { position: relative; z-index: 1; }
  #card .card-text { display: inline; }

  /* ---- HUD ---- */
  #hud { position: absolute; z-index: 6; right: 14px; top: 12px; display: flex; gap: 10px; align-items: center; }
  #hud button {
    font: inherit; font-weight: 800; color: var(--ink); background: #fff;
    border: var(--ink-w) solid var(--ink); border-radius: 999px; width: 46px; height: 46px;
    cursor: pointer; display: grid; place-items: center; font-size: 18px;
    box-shadow: 3px 4px 0 rgba(28, 42, 74, .8);
    transition: transform 90ms, box-shadow 90ms;
  }
  /* Press the button into its own shadow — the cheapest way to make a
     control feel physical, and it costs no extra art. */
  #hud button:active { transform: translate(3px, 4px); box-shadow: 0 0 0 rgba(28, 42, 74, .8); }
  #hud button.on { background: #ffe3ea; }
  #hud .replay { width: auto; padding: 0 22px; display: none; background: #63e0a4; }
  #hud .replay.show { display: grid; }

  /* ---- Next: the one deliberate way to move on ----
     Advancing used to be a tap anywhere, so the same gesture both dismissed a
     line and poked whatever was underneath it. It is a button now. It appears
     only while the game is genuinely waiting, and it nudges itself every few
     seconds so a child who has finished reading knows where to look. */
  #next {
    position: absolute; z-index: 6; right: 22px; bottom: 26px;
    font: inherit; font-weight: 800; font-size: clamp(17px, 2vw, 23px); color: #fff;
    background: #ff9f1c; border: var(--ink-w) solid var(--ink); border-radius: 999px;
    padding: 13px 26px 13px 30px; cursor: pointer; display: none; align-items: center; gap: 10px;
    box-shadow: var(--ink-shadow); text-shadow: 0 2px 0 rgba(150, 80, 0, .45);
    transition: transform 90ms, box-shadow 90ms, opacity 160ms;
  }
  #next.show { display: inline-flex; animation: nextNudge 2.1s ease-in-out infinite; }
  #next:active { transform: translate(4px, 5px); box-shadow: 0 0 0 rgba(28, 42, 74, .85); animation: none; }
  #next .chev { font-size: 1.1em; line-height: 1; }
  @keyframes nextNudge {
    0%, 70%, 100% { transform: translateX(0); }
    80% { transform: translateX(5px); }
    90% { transform: translateX(1px); }
  }
  @media (max-width: 760px) { #next { right: 14px; bottom: 18px; padding: 11px 20px 11px 24px; } }
  #progress-track { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.35); }
  #progress { height: 100%; width: 0; background: #3d8bff; transition: width 400ms ease; }

  /* ---- title screen ----------------------------------------------------
     The painted banner is the whole screen, with the snow that falls through
     the lesson falling in front of it and the play button sitting on a cold
     floor at the bottom. Everything here is torn down by TitleFx.stop() the
     moment the lesson starts.
  */
  #loading {
    position: absolute; inset: 0; z-index: 10; display: grid; place-items: center;
    background: #9ecdf0; overflow: hidden;
    transition: opacity 400ms ease, visibility 0s linear 400ms;
  }
  /* `pointer-events: none` here is not enough on its own: #start re-enables
     it for itself below, so the faded-out button would keep swallowing every
     tap in the middle of the screen. visibility takes the whole overlay out
     of hit-testing, and the delayed transition lets the fade finish first. */
  #loading.gone { opacity: 0; pointer-events: none; visibility: hidden; }
  #loading.gone #start { pointer-events: none; }

  .title-stage { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .title-art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 40%;
    /* Held a little over 1 so the slow drift never exposes an edge. */
    transform: scale(1.035);
    user-select: none; -webkit-user-drag: none;
  }
  .title-sheen {
    position: absolute; top: -20%; bottom: -20%; left: 0; width: 38%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .5), transparent);
    opacity: 0; mix-blend-mode: screen;
  }
  .title-snow { position: absolute; inset: 0; }
  /* A cold settling of the light toward the bottom of the frame. It used to
     be a floor for the button; the button now sits up on the ice, so this is
     back to doing the one thing it is good at — keeping the foreground from
     being as bright as the middle distance. */
  .title-scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
    background: linear-gradient(180deg, rgba(150, 203, 237, 0) 0%, rgba(120, 184, 227, .16) 58%, rgba(92, 163, 212, .34) 100%);
  }

  /* Pinned to a point in the PAINTING — the open ice under the logo — not to
     a corner of the window. The art is object-fit: cover, so on anything but
     16:9 the window and the picture disagree about where "three quarters
     across" is; TitleFx.placePlay() does the cover arithmetic and sets these
     two values. The transform centres it on that point. */
  .title-play {
    position: absolute; left: 50%; top: 76%;
    transform: translate(-50%, -50%);
  }
  #start {
    position: relative; z-index: 2; display: block;
    width: clamp(118px, 19vh, 212px); height: clamp(118px, 19vh, 212px);
    padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer;
    opacity: .3; pointer-events: none;
    filter: drop-shadow(0 10px 18px rgba(12, 64, 102, .45));
    transition: opacity 340ms ease, filter 110ms ease, transform 110ms ease;
  }
  #start img { display: block; width: 100%; height: 100%; }
  #loading.ready #start { opacity: 1; pointer-events: auto; }
  #start:active { transform: translateY(4px) scale(.965); filter: drop-shadow(0 4px 8px rgba(12, 64, 102, .5)) brightness(.97); }
  #start:focus-visible { outline: 4px solid #fff; outline-offset: 7px; border-radius: 50%; }
  .start-halo {
    position: absolute; inset: -30%; border-radius: 50%; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255, 238, 176, .6), rgba(255, 214, 120, .16) 60%, rgba(255, 214, 120, 0) 100%);
  }
  .start-sparks { position: absolute; inset: -20%; pointer-events: none; z-index: 3; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    #bubble, #card, #progress, #next, #hud button { transition: none; }
    #next.show { animation: none; }
  }

  .bubble-line { display: block; }
</style>
</head>
<body>
<div id="game">
  <div id="stage"></div>
  <div id="bubble" role="status" aria-live="polite" aria-atomic="true">
    <svg class="bubble-skin" aria-hidden="true"><path class="skin-fill"/><path class="skin-line"/><ellipse class="skin-sheen"/></svg>
    <div class="dialogue-inner"><span class="bubble-line"></span></div>
  </div>
  <!-- Progress is announced to a screen reader only. On screen it is the
       confetti, the sound and Swiftee's reaction that say "well done"; a
       yellow toast saying so as well was a caption on a joke. -->
  <div id="reward" class="sr-only" role="status" aria-live="polite"></div>
  <div id="card" role="note"></div>
  <div id="hud">
    <button class="replay" type="button">Play again</button>
    <button class="mute" type="button" aria-label="Mute" aria-pressed="false">🔊</button>
    <button class="restart" type="button" aria-label="Restart">↻</button>
  </div>
  <!-- TEMPORARY. A screen picker for reviewing the lesson without playing
       thirty-nine screens to reach the one in question. It is deliberately
       easy to delete: this element, the #jump rules in the stylesheet, and
       the wireJump() call in game.js. Marked data-dev so the test suites can
       tell a review tool from part of the game. -->
  <div id="jump" data-dev="1">
    <label class="sr-only" for="jump-sel">Jump to screen</label>
    <select id="jump-sel"></select>
  </div>
  <button id="next" type="button" aria-label="Next"><span>Next</span><span class="chev" aria-hidden="true">&#9654;</span></button>
  <div id="progress-track"><div id="progress"></div></div>

  <div id="loading">
    <div class="title-stage" aria-hidden="true">
      <img class="title-art" src="assets/ui/banner.webp" alt="" draggable="false">
      <div class="title-sheen"></div>
      <div class="title-snow"></div>
      <div class="title-scrim"></div>
    </div>
    <h1 class="sr-only">Swiftee &amp; the Polygons</h1>
    <div class="title-play">
      <button id="start" type="button" aria-label="Start">
        <span class="start-halo" aria-hidden="true"></span>
        <img src="assets/ui/play.webp" alt="" draggable="false">
      </button>
      <span class="start-sparks" aria-hidden="true"></span>
    </div>
  </div>
</div>

<script src="src/fx/sleigh-intro.js"></script>

</html>
