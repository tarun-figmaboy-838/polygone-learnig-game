<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Swiftee — Polygons</title>
<!-- inline, so the page never fires a 404 for a favicon it does not have -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%90%A6</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<!-- the backdrop is the first thing on screen; fetch it alongside the scripts -->
<link rel="preload" as="image" href="assets/ui/banner.webp">
<link rel="preload" as="image" href="assets/bg/ice-vista.png">
<style>
  :root {
    --ink: #1c2a4a;
    --sky: #bfe3fb;
    --bubble: #ffffff;
    --bubble-edge: #9fd6fb;
    --card: #fffdf4;
    --sans: "Nunito", "Segoe UI", system-ui, sans-serif;
    /* Comic ink: one outline weight and one hard offset shadow, reused by the
       bubble, the card and every button, so they read as one drawn set
       instead of three unrelated widgets. */
    --ink-w: 3px;
    --ink-shadow: 4px 5px 0 rgba(28, 42, 74, .85);
    --tail-h: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #a9d6f4; font-family: var(--sans); color: var(--ink); overflow: hidden; }

  #game { position: fixed; inset: 0; background: linear-gradient(#bfe3fb, #f7fcff); }
  #stage { position: absolute; inset: 0; }

  /* Swiftee is an HTML/SVG overlay positioned by game.js */
  .swiftee { z-index: 3; }

  /* ---- speech bubble --------------------------------------------------
     The shape and the motion are the supplied design; the colours are the
     game's own. Four parts make it, and each is doing a job:

       the sheen   a catch-light in the top-left corner, so the panel reads as
                   something with a surface rather than as a fill
       the marks   two short strokes either side converging on the box — the
                   comic-book "said with feeling"
       the horn    a curved tail off whichever edge faces Swiftee, FILLED
                   first so it covers the body's own border at the join and
                   then stroked along its two free edges only, so one unbroken
                   outline runs round body and horn together
       the pop     it grows out of the horn. aimTail() sets the origin to
                   wherever the horn ended up, so the bubble springs from
                   Swiftee rather than from an arbitrary corner

     EVERYTHING IS SIZED IN em, off one clamped font-size on #bubble itself.
     Padding, radius, horn, sheen and marks then scale together, and the phone
     breakpoints only have to change one number.

     THREE DEPARTURES from the supplied file, each for a reason:

       NO GHOST COPY. It reserved the final width with a hidden duplicate of
       the line while the live copy sat absolutely on top of it. That is what
       you need when text is typed a character at a time and grows. Here every
       word is laid out from the first frame and hidden with opacity, so the
       box is already its final size and the duplicate has nothing to reserve
       — it only doubled the DOM and left wrapped text left-aligned inside a
       centred box.

       NO 10px TEXT OFFSET. `.type-wrap { margin-left: 10px }` pushed the line
       ten pixels right of centre against em-based padding: measured at 1280,
       800 and 390, a constant 10px, which on a phone is nearly half an em.

       THE MARKS SIT INSIDE THE PADDING, not outside the box. The bubble's
       position is measured against the lesson so it never covers the polygon,
       and anything painted outside its border box is invisible to that
       measurement — the marks would be the one part of the bubble free to
       land on the shape.
  */
  #bubble {
    --cream: #fff8e7;
    --cream-light: #fffdf5;
    --cream-foot: #fff2d6;
    --orange: #ffb515;
    --orange-dark: #e08200;
    --text: #064d68;
    --rim: 4px;

    position: absolute; z-index: 4;
    box-sizing: border-box;
    /* One size for the whole component; everything below is em of this. */
    font-size: clamp(20px, 2.3vw, 33px);
    max-width: min(820px, 68vw);
    min-width: 260px;
    min-height: 2.5em;
    padding: .62em 1em;
    display: flex; align-items: center; justify-content: center;

    border: var(--rim) solid var(--orange);
    border-radius: .62em;
    background: linear-gradient(180deg, var(--cream-light) 0%, var(--cream) 70%, var(--cream-foot) 100%);
    box-shadow:
      0 0 14px 2px rgba(255, 181, 21, .28),
      0 0 34px 10px rgba(255, 181, 21, .14),
      0 10px 26px rgba(20, 70, 92, .22);

    /* Pops out of its own horn, overshoots, settles. The origin here is only
       the frame-zero default; aimTail() moves it to the horn. */
    opacity: 0; pointer-events: none;
    transform: scale(.15);
    transform-origin: 12% 100%;
    transition: transform 440ms cubic-bezier(.2, .9, .3, 1.45), opacity 200ms ease;
  }
  #bubble.show { opacity: 1; pointer-events: auto; cursor: pointer; transform: none; }
  /* going away is quicker than arriving, and does not overshoot */
  #bubble.out { transition: transform 260ms ease-in, opacity 220ms ease 40ms; }

  /* the catch-light in the top-left corner */
  #bubble::before {
    content: ""; position: absolute; left: .42em; top: .34em;
    width: .5em; height: .2em; border-radius: 999px;
    background: #fff; opacity: .95; transform: rotate(-22deg);
    pointer-events: none; z-index: 3;
  }

  .dialogue-inner {
    position: relative; z-index: 2; max-width: 100%;
    color: var(--text);
    font-family: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", var(--sans);
    font-size: inherit; font-weight: 600; line-height: 1.2;
    letter-spacing: .2px; text-align: center; text-wrap: balance;
  }
  /* Screens with nothing else on them get room to breathe. It is one number,
     because everything else is em. */
  #bubble.solo { font-size: clamp(26px, 3.15vw, 46px); min-height: 3.2em; }

  /* Mood tints the paper and nothing else. The rim is the bubble's identity
     and never changes, so a win does not arrive looking like a different
     widget. */
  #bubble[data-mood="win"]   { --cream: #f3fce9; --cream-light: #fdfff8; --cream-foot: #e9f8d9; }
  #bubble[data-mood="hint"]  { --cream: #fff1cf; --cream-light: #fffbee; --cream-foot: #ffeabb; }
  #bubble[data-mood="think"] { --cream: #f1f9fb; --cream-light: #fbfeff; --cream-foot: #e4f3f8; }

  /* ---- two short strokes each side, converging on the box ---- */
  .bubble-mark {
    position: absolute; top: 50%;
    width: .5em; height: .78em;
    transform: translateY(-50%);
    fill: none; stroke: var(--orange); stroke-width: 7; stroke-linecap: round;
    overflow: visible; pointer-events: none; opacity: .85;
  }
  .mark-left  { left: .28em; }
  .mark-right { right: .28em; }

  /* ---- the horn ----
     Drawn pointing down out of the bottom edge. The strip above y=0 in the
     viewBox is the part that sits INSIDE the body, covering its border where
     the two meet; the stroke skips that strip and runs the outline down the
     two free edges only. aimTail() sets left/top/rotation — these are the
     defaults for the frame before it runs.

     The origin is the middle of the join: x 22 of 44 is 50%, y 0 of the
     -8..34 range is 19.05%. Everything about aiming it depends on those two
     numbers matching the path, so they are derived here and nowhere else. */
  .dialogue-tail {
    position: absolute; z-index: 3;
    left: 50%; top: 100%;
    width: 1.15em; height: auto; overflow: visible;
    transform: translate(-50%, -19.05%);
    transform-origin: 50% 19.05%;
    pointer-events: none;
  }
  .tail-fill   { fill: var(--cream-foot); }
  .tail-stroke {
    fill: none; stroke: var(--orange); stroke-width: var(--rim);
    stroke-linecap: round; stroke-linejoin: round;
    /* the svg is about an em wide for a 44-unit viewBox: hold the stroke at
       the body's own border width whatever the type size */
    vector-effect: non-scaling-stroke;
  }

  @media (max-width: 900px) {
    #bubble { font-size: clamp(18px, 2.6vw, 27px); min-width: 220px; }
    #bubble.solo { font-size: clamp(22px, 3.4vw, 34px); }
  }
  @media (max-width: 600px) {
    #bubble { font-size: clamp(16px, 4.6vw, 23px); min-width: 170px; --rim: 3px; }
    #bubble.solo { font-size: clamp(18px, 5.4vw, 26px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #bubble { transform: none; transition: opacity 200ms ease; }
    #bubble.out { transition: opacity 160ms ease; }
  }

  /* ---- the line arrives a word at a time ----
     Each word is its own span, faded in on a timer. They are hidden with
     opacity rather than display, so the bubble is laid out at its FINAL size
     from the first frame: it never grows as the words arrive, which means it
     never jitters and never has to be re-placed against the lesson mid-line. */
  .bubble-line .w, .bubble-line .dc-term {
    transition: opacity 260ms cubic-bezier(.2, .7, .3, 1), filter 260ms cubic-bezier(.2, .7, .3, 1);
  }
  .bubble-line.revealing .w, .bubble-line.revealing .dc-term { opacity: 0; filter: blur(4px); }
  .bubble-line .w.in, .bubble-line .dc-term.in { opacity: 1; filter: none; }
  @media (prefers-reduced-motion: reduce) {
    .bubble-line .w, .bubble-line .dc-term { transition: none; }
  }

  /* ---- dual coding: the term is tinted, and the thing it names lights
     up on the stage in that same colour, as the word appears ---- */
  .dc-term {
    display: inline-block;
    padding: .04em .34em; margin: 0 .03em;
    border-radius: .4em; font-weight: 800; white-space: nowrap;
  }

  /* ---- instruction card ---- */
  /* A taped-on note. Same ink as the bubble, tilted the other way so the two
     never read as parallel. Its width is capped in game.js against the live
     stage panel rather than guessed here, so it can never grow into the
     shape the child is working on. */
  #card {
    position: absolute; z-index: 4; left: 3%; top: 4%; max-width: 44%;
    background: var(--card); border: var(--ink-w) solid var(--ink); border-radius: 14px;
    padding: 11px 20px; font-size: clamp(15px, 1.6vw, 21px); font-weight: 800;
    box-shadow: var(--ink-shadow);
    opacity: 0; transform: translateY(-10px) rotate(-1.2deg) scale(.94);
    transition: opacity 180ms ease, transform 300ms cubic-bezier(.34,1.56,.64,1);
    display: flex; align-items: center; gap: 12px;
  }
  #card.show { opacity: 1; transform: rotate(-1.2deg); }
  .dc-gesture { flex: none; width: 26px; height: 26px; }
  #card .card-text { display: inline; }

  /* ---- HUD ---- */
  #hud { position: absolute; z-index: 6; right: 14px; top: 12px; display: flex; gap: 10px; align-items: center; }
  #hud button {
    font: inherit; font-weight: 800; color: var(--ink); background: #fff;
    border: var(--ink-w) solid var(--ink); border-radius: 999px; width: 46px; height: 46px;
    cursor: pointer; display: grid; place-items: center; font-size: 18px;
    box-shadow: 3px 4px 0 rgba(28, 42, 74, .8);
    transition: transform 90ms, box-shadow 90ms;
  }
  /* Press the button into its own shadow — the cheapest way to make a
     control feel physical, and it costs no extra art. */
  #hud button:active { transform: translate(3px, 4px); box-shadow: 0 0 0 rgba(28, 42, 74, .8); }
  #hud button.on { background: #ffe3ea; }
  #hud .replay { width: auto; padding: 0 22px; display: none; background: #63e0a4; }
  #hud .replay.show { display: grid; }

  /* ---- Next: the one deliberate way to move on ----
     Advancing used to be a tap anywhere, so the same gesture both dismissed a
     line and poked whatever was underneath it. It is a button now. It appears
     only while the game is genuinely waiting, and it nudges itself every few
     seconds so a child who has finished reading knows where to look. */
  #next {
    position: absolute; z-index: 6; right: 22px; bottom: 26px;
    font: inherit; font-weight: 800; font-size: clamp(17px, 2vw, 23px); color: #fff;
    background: #ff9f1c; border: var(--ink-w) solid var(--ink); border-radius: 999px;
    padding: 13px 26px 13px 30px; cursor: pointer; display: none; align-items: center; gap: 10px;
    box-shadow: var(--ink-shadow); text-shadow: 0 2px 0 rgba(150, 80, 0, .45);
    transition: transform 90ms, box-shadow 90ms, opacity 160ms;
  }
  #next.show { display: inline-flex; animation: nextNudge 2.1s ease-in-out infinite; }
  #next:active { transform: translate(4px, 5px); box-shadow: 0 0 0 rgba(28, 42, 74, .85); animation: none; }
  #next .chev { font-size: 1.1em; line-height: 1; }
  @keyframes nextNudge {
    0%, 70%, 100% { transform: translateX(0); }
    80% { transform: translateX(5px); }
    90% { transform: translateX(1px); }
  }
  @media (max-width: 760px) { #next { right: 14px; bottom: 18px; padding: 11px 20px 11px 24px; } }
  #progress-track { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.35); }
  #progress { height: 100%; width: 0; background: #3d8bff; transition: width 400ms ease; }

  /* ---- title screen ----------------------------------------------------
     The painted banner is the whole screen, with the snow that falls through
     the lesson falling in front of it and the play button sitting on a cold
     floor at the bottom. Everything here is torn down by TitleFx.stop() the
     moment the lesson starts.
  */
  #loading {
    position: absolute; inset: 0; z-index: 10; display: grid; place-items: center;
    background: #9ecdf0; overflow: hidden;
    transition: opacity 400ms ease, visibility 0s linear 400ms;
  }
  /* `pointer-events: none` here is not enough on its own: #start re-enables
     it for itself below, so the faded-out button would keep swallowing every
     tap in the middle of the screen. visibility takes the whole overlay out
     of hit-testing, and the delayed transition lets the fade finish first. */
  #loading.gone { opacity: 0; pointer-events: none; visibility: hidden; }
  #loading.gone #start { pointer-events: none; }

  .title-stage { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .title-art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 40%;
    /* Held a little over 1 so the slow drift never exposes an edge. */
    transform: scale(1.035);
    user-select: none; -webkit-user-drag: none;
  }
  .title-sheen {
    position: absolute; top: -20%; bottom: -20%; left: 0; width: 38%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .5), transparent);
    opacity: 0; mix-blend-mode: screen;
  }
  .title-snow { position: absolute; inset: 0; }
  /* A cold settling of the light toward the bottom of the frame. It used to
     be a floor for the button; the button now sits up on the ice, so this is
     back to doing the one thing it is good at — keeping the foreground from
     being as bright as the middle distance. */
  .title-scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
    background: linear-gradient(180deg, rgba(150, 203, 237, 0) 0%, rgba(120, 184, 227, .16) 58%, rgba(92, 163, 212, .34) 100%);
  }

  /* Pinned to a point in the PAINTING — the open ice under the logo — not to
     a corner of the window. The art is object-fit: cover, so on anything but
     16:9 the window and the picture disagree about where "three quarters
     across" is; TitleFx.placePlay() does the cover arithmetic and sets these
     two values. The transform centres it on that point. */
  .title-play {
    position: absolute; left: 50%; top: 76%;
    transform: translate(-50%, -50%);
  }
  #start {
    position: relative; z-index: 2; display: block;
    width: clamp(118px, 19vh, 212px); height: clamp(118px, 19vh, 212px);
    padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer;
    opacity: .3; pointer-events: none;
    filter: drop-shadow(0 10px 18px rgba(12, 64, 102, .45));
    transition: opacity 340ms ease, filter 110ms ease, transform 110ms ease;
  }
  #start img { display: block; width: 100%; height: 100%; }
  #loading.ready #start { opacity: 1; pointer-events: auto; }
  #start:active { transform: translateY(4px) scale(.965); filter: drop-shadow(0 4px 8px rgba(12, 64, 102, .5)) brightness(.97); }
  #start:focus-visible { outline: 4px solid #fff; outline-offset: 7px; border-radius: 50%; }
  .start-halo {
    position: absolute; inset: -30%; border-radius: 50%; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255, 238, 176, .6), rgba(255, 214, 120, .16) 60%, rgba(255, 214, 120, 0) 100%);
  }
  .start-sparks { position: absolute; inset: -20%; pointer-events: none; z-index: 3; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    #bubble, #card, #progress, #next, #hud button { transition: none; }
    #next.show { animation: none; }
  }

  .bubble-line { display: block; }
</style>
</head>
<body>
<div id="game">
  <div id="stage"></div>
  <div id="bubble" role="status" aria-live="polite" aria-atomic="true">
    <svg class="bubble-mark mark-left" viewBox="0 0 40 60" aria-hidden="true">
      <path d="M8 12 L30 24" /><path d="M8 48 L30 36" />
    </svg>
    <div class="dialogue-inner"><span class="bubble-line"></span></div>
    <svg class="bubble-mark mark-right" viewBox="0 0 40 60" aria-hidden="true">
      <path d="M32 12 L10 24" /><path d="M32 48 L10 36" />
    </svg>
    <svg class="dialogue-tail" viewBox="0 -8 44 42" aria-hidden="true">
      <path class="tail-fill"   d="M4 -8 H42 V0 C36 12 24 22 2 34 C8 24 8 12 4 0 Z" />
      <path class="tail-stroke" d="M42 0 C36 12 24 22 2 34 C8 24 8 12 4 0" />
    </svg>
  </div>
  <!-- Progress is announced to a screen reader only. On screen it is the
       confetti, the sound and Swiftee's reaction that say "well done"; a
       yellow toast saying so as well was a caption on a joke. -->
  <div id="reward" class="sr-only" role="status" aria-live="polite"></div>
  <div id="card" role="note"></div>
  <div id="hud">
    <button class="replay" type="button">Play again</button>
    <button class="mute" type="button" aria-label="Mute" aria-pressed="false">🔊</button>
    <button class="restart" type="button" aria-label="Restart">↻</button>
  </div>
  <button id="next" type="button" aria-label="Next"><span>Next</span><span class="chev" aria-hidden="true">&#9654;</span></button>
  <div id="progress-track"><div id="progress"></div></div>

  <div id="loading">
    <div class="title-stage" aria-hidden="true">
      <img class="title-art" src="assets/ui/banner.webp" alt="" draggable="false">
      <div class="title-sheen"></div>
      <div class="title-snow"></div>
      <div class="title-scrim"></div>
    </div>
    <h1 class="sr-only">Swiftee &amp; the Polygons</h1>
    <div class="title-play">
      <button id="start" type="button" aria-label="Start">
        <span class="start-halo" aria-hidden="true"></span>
        <img src="assets/ui/play.webp" alt="" draggable="false">
      </button>
      <span class="start-sparks" aria-hidden="true"></span>
    </div>
  </div>
</div>

<!-- Load order is the dependency order: each module reads the ones above it. -->
<script src="src/audio/sfx.js"></script>
<script src="src/fx/juice.js"></script>
<script src="src/fx/snowflake.js"></script>
<script src="src/fx/titlefx.js"></script>
<script src="src/fx/transition.js"></script>
<script src="src/core/input.js"></script>
<script src="src/core/polygon-math.js"></script>
<script src="src/core/director.js"></script>
<script src="src/game/screens.js"></script>
<!-- generated from assets/swiftee/swiftee.manifest.json by tools/build-swiftee-frames.js -->
<script src="src/character/swiftee-frames.js"></script>
<script src="src/character/swiftee.js"></script>
<script src="src/game/stage.js"></script>
<script src="src/game/dual-coding.js"></script>
<script src="src/game/quest.js"></script>
<script src="src/game/game.js"></script>
</body>
</html>
