<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice check — Swiftee &amp; the Polygons</title>
<!--
  Listen to every clip against the line it is filed under, and fix the ones
  that are wrong.

  WHY THIS EXISTS. The recording is one long take and the cutter can hear
  where the gaps are but not what was said, so which piece belongs to which
  line was settled by length — a guess that is right often and not always.
  Nobody can check that by reading a number. Play it, read the line beside
  it, and if they do not match pick the right line from the box.

  HOW TO USE IT.
    1. Open this file from a served copy of the game (npm start, then
       /tools/vo-check.html) — a file:// page cannot read the clips.
    2. Press play on each row. If the words match the line, leave it.
    3. If they do not, choose the line it really is. Rows turn amber when
       you change them.
    4. Press "Copy the corrected mapping", paste over
       assets/vo/take/mapping.json, and run:
           node tools/split-vo.js --apply
-->
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 28px clamp(16px, 4vw, 48px) 80px;
         font: 16px/1.5 "Segoe UI", system-ui, sans-serif; color: #12304f; background: #eef7fd; }
  h1 { font-size: clamp(22px, 3vw, 30px); margin: 0 0 6px; }
  p.lede { margin: 0 0 22px; max-width: 70ch; color: #3a5e80; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 12px; overflow: hidden;
          box-shadow: 0 2px 14px rgba(18, 48, 79, .10); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e3eef7; vertical-align: middle; }
  th { background: #dcecf8; font-weight: 700; font-size: 14px; letter-spacing: .02em; }
  tr:last-child td { border-bottom: 0; }
  tr.changed td { background: #fff7e3; }
  td.id { font-family: ui-monospace, Consolas, monospace; font-weight: 700; white-space: nowrap; }
  td.secs { color: #5e7e9c; font-variant-numeric: tabular-nums; white-space: nowrap; }
  audio { height: 34px; }
  select { font: inherit; padding: 5px 7px; border-radius: 8px; border: 1px solid #b9d4e8; max-width: 48ch; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px clamp(16px, 4vw, 48px);
         background: #12304f; color: #fff; display: flex; gap: 14px; align-items: center; }
  button { font: inherit; font-weight: 700; padding: 9px 18px; border: 0; border-radius: 10px;
           background: #f2b544; color: #3a2a06; cursor: pointer; }
  button.ghost { background: #2b5a85; color: #fff; }
  .note { font-size: 14px; opacity: .85; }
</style>
</head>
<body>
<h1>Voice check</h1>
<p class="lede">Play each clip and read the line beside it. If they are not the same words, choose the
line it really is. Then copy the mapping and run <code>node tools/split-vo.js --apply</code>.</p>

<table id="rows"><thead><tr>
  <th style="width:6.5em">Clip</th><th style="width:5em">Length</th><th style="width:15em">Listen</th><th>The line it is filed under</th>
</tr></thead><tbody></tbody></table>

<div class="bar">
  <button id="copy">Copy the corrected mapping</button>
  <button class="ghost" id="reset">Undo my changes</button>
  <span class="note" id="status">Loading…</span>
</div>

<script>
/* The lines come from the deck itself, so this page cannot drift from the game. */
(async function () {
  const status = document.getElementById('status');
  const tbody = document.querySelector('#rows tbody');
  const load = (src) => new Promise((ok, no) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s);
  });
  try { await load('../src/game/screens.js'); }
  catch (e) { status.textContent = 'Could not read the deck — open this page from a served copy of the game.'; return; }

  const lines = [];
  (window.Screens.list || []).forEach((s) => (s.beats || []).forEach((b) => {
    if (b && typeof b.say === 'string' && b.vo) lines.push({ id: b.vo, text: b.say, screen: s.id });
    if (b && typeof b.instruction === 'string' && b.vo) lines.push({ id: b.vo, text: b.instruction, screen: s.id });
  }));
  const byId = {}; lines.forEach((l) => { byId[l.id] = l; });

  let map;
  try { map = await (await fetch('../assets/vo/take/mapping.json', { cache: 'no-cache' })).json(); }
  catch (e) { status.textContent = 'No assets/vo/take/mapping.json — run: npm run split:vo'; return; }
  const original = JSON.stringify(map);

  map.segments.forEach((seg, i) => {
    const tr = document.createElement('tr');
    const opts = ['<option value="">— not used —</option>'].concat(lines.map((l) =>
      '<option value="' + l.id + '"' + (l.id === seg.id ? ' selected' : '') + '>' +
      l.id + ' · ' + l.text.replace(/</g, '&lt;').slice(0, 64) + '</option>'));
    tr.innerHTML =
      '<td class="id">' + seg.file + '</td>' +
      '<td class="secs">' + seg.seconds + 's</td>' +
      '<td><audio controls preload="none" src="../assets/vo/take/' + seg.file + '"></audio></td>' +
      '<td><select data-i="' + i + '">' + opts.join('') + '</select></td>';
    tbody.appendChild(tr);
    tr.querySelector('select').addEventListener('change', (e) => {
      map.segments[i].id = e.target.value;
      map.segments[i].line = byId[e.target.value] ? byId[e.target.value].text : '';
      tr.classList.add('changed');
      status.textContent = 'changed ' + tbody.querySelectorAll('tr.changed').length;
    });
  });
  status.textContent = map.segments.length + ' clips, ' + lines.length + ' lines to choose from';

  document.getElementById('copy').addEventListener('click', async () => {
    const text = JSON.stringify(map, null, 2) + '\n';
    try { await navigator.clipboard.writeText(text); status.textContent = 'Copied — paste over assets/vo/take/mapping.json'; }
    catch (e) { const w = window.open('', '_blank'); w.document.body.innerHTML = '<pre></pre>'; w.document.querySelector('pre').textContent = text; }
  });
  document.getElementById('reset').addEventListener('click', () => { location.reload(); });
  void original;
}());
</script>
</body>
</html>
